name: CI

# No publishing secrets are available to CI or pull requests.
on:
  push:
    branches:
      - main
      - '1.21.x'
      - 'mc/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and GameTests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the Minecraft line of the branch
        shell: bash
        env:
          # A pull request is checked against the branch it merges into.
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash scripts/validate-release.sh branch "$BRANCH"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --console=plain

      - name: GameTests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew runGameTestServer --console=plain | tee gametest.log
          grep -q "required tests passed" gametest.log
