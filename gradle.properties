org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared by every Minecraft version. Each version's own values (NeoForge, Java, optional mod APIs) are in
# versions/<minecraft>/gradle.properties; the versions themselves are listed in settings.gradle.kts.
loader_version_range=[1,)

mod_id=dimensionalfluxminer
mod_name=Dimensional Flux Miner
mod_license=EPL-2.0
# Base version of the open update (X.Y.Z). Alpha/beta/stable come from the release tag (see docs/RELEASING.md).
mod_version=0.2.9
mod_group_id=dimensionalfluxminer
