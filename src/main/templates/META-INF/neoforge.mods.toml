modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/vindocel/Dimensional-Flux-Miner/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/vindocel/Dimensional-Flux-Miner"
logoFile="logo.png"
description='''
A miner that never digs: it turns energy into the ores of your dimension. With a crusher, an electric furnace and an animated guide.
'''

# Icon in the mod list of the Catalogue mod.
[modproperties.${mod_id}]
    catalogueImageIcon="icon.png"

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
